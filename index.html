<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean-room reconstruction of a 1982-style parser adventure: typed Inglish parser and a living world."
    />
    <title>The Hobbit — A Text Adventure</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 id="loc-title" class="loc-title">A Comfortable Hall</h1>
        <span id="score" class="score" aria-label="Progress score">Score 0%</span>
      </header>
      <main class="layout">
        <section class="scene" aria-label="Current location">
          <div id="scene-art" class="scene-art" aria-hidden="true"></div>
          <div id="log" class="log" role="log" aria-live="polite"></div>
        </section>
      </main>
      <form id="command-form" class="command-bar" autocomplete="off">
        <span class="prompt-glyph" aria-hidden="true">&gt;</span>
        <input
          id="command-input"
          class="command-input"
          type="text"
          name="command"
          maxlength="128"
          placeholder='Try: take map · take lamp · go east · say to elrond "read map"'
          aria-label="Command input"
          autofocus
        />
        <button type="submit" class="command-submit">Enter</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
